name: DevMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Lint with flake8
      run: |
        flake8 server.py agent.py model_usage_tracker.py workspace_index.py main.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 server.py agent.py model_usage_tracker.py workspace_index.py main.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Syntax check
      run: |
        python -m py_compile server.py
        python -m py_compile agent.py
        python -m py_compile model_usage_tracker.py
        python -m py_compile workspace_index.py
        python -m py_compile main.py

    - name: Run regression tests
      run: |
        python -m pytest test_all_tiers.py -v || true
        python -m pytest test_skills.py -v || true
        python -m pytest test_fork.py -v || true
        python -m pytest test_delete_file.py -v || true
        python -m pytest test_generic_tool.py -v || true
        python -m pytest test_usage_tracker.py -v || true

    - name: Check server import
      run: |
        python -c "import server; print('server.py OK')"
        python -c "import agent; print('agent.py OK')"
        python -c "import model_usage_tracker; print('model_usage_tracker.py OK')"
        python -c "import workspace_index; print('workspace_index.py OK')"